name: Lamplit container checks and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: lamplit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Dagger repository check
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out mirror commit
        uses: actions/checkout@v4
      - name: Run the reviewed Dagger check
        uses: dagger/dagger-for-github@v8.0.0
        with:
          version: 0.21.7
          verb: call -m dagger check --source .

  publish:
    name: Publish stable GHCR artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged mirror commit
        uses: actions/checkout@v4
      - name: Validate the stable SemVer tag
        run: node scripts/release-tag-check.mjs "$GITHUB_REF_NAME"
      - name: Build release SBOM and notice bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts/licenses
          node scripts/generate-sbom.mjs --version "$version" --output "release-artifacts/lamplit-${version}.spdx.json"
          cp NOTICE THIRD_PARTY_NOTICES.md LICENSE release-artifacts/
          cp licenses/* release-artifacts/licenses/
          node scripts/validate-license-artifacts.mjs
      - name: Upload release SBOM and notices
        uses: actions/upload-artifact@v4
        with:
          name: lamplit-${{ github.ref_name }}-licenses-and-sbom
          path: release-artifacts/
          if-no-files-found: error
      - name: Publish through Dagger with the GitHub token
        uses: dagger/dagger-for-github@v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 0.21.7
          verb: call -m dagger publish --source . --release-tag "$GITHUB_REF_NAME" --registry-username "$GITHUB_ACTOR" --registry-password env:GITHUB_TOKEN
